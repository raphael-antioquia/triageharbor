# Standalone production topology.
# Do not combine this file with the local-development compose.yaml.
#
# Database identities are fixed:
#   triageharbor_admin     image bootstrap superuser; postgres + role-bootstrap only
#   triageharbor_migrator  Flyway, explicit project provisioning, credential-admin
#   triageharbor_app       runtime; migrate context + backend
#
# Commissioning on an EMPTY volume (full procedure: prod/credential-operations.md):
#   1. up -d --wait postgres
#   2. --profile role-bootstrap run --rm role-bootstrap
#   3. run --rm migrate
#   4. --profile project-provision run --rm -T project-provision
#   5. --profile credential-admin run --rm --no-deps -T credential-admin
#        issue --project <id>    (stdout to a private file, never a terminal)
#   6. up -d
#
# Provisioning never issues credentials; ingestion returns 401 until one is issued.
# role-bootstrap provisions database identities only; it is one stage of
# production commissioning, not all of it.
#
# POSTGRES_USER/POSTGRES_PASSWORD apply only when the volume is empty.

name: triageharbor-prod

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: triageharbor_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}

    volumes:
      # PostgreSQL 17 stores PGDATA at /var/lib/postgresql/data.
      # PostgreSQL 18+ changed the volume root to /var/lib/postgresql
      # and PGDATA to /var/lib/postgresql/<major>/docker
      # (for example, /var/lib/postgresql/18/docker).
      # A major-version change requires a proper PostgreSQL upgrade
      # (pg_upgrade or dump/restore), not just changing this image tag.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Operator-invoked role provisioning. Never a dependency of migrate/backend.
  # psql entrypoint bypasses docker-entrypoint.sh; the admin password travels
  # only in PGPASSWORD, never in the command line.
  role-bootstrap:
    image: postgres:17.11
    profiles: ["role-bootstrap"]
    restart: "no"
    entrypoint: ["psql"]
    command: ["-X", "-f", "/bootstrap/bootstrap-roles.sql"]

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
      PGUSER: triageharbor_admin
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      PGAPPNAME: triageharbor-role-bootstrap
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}

    volumes:
      - type: bind
        source: ./prod/postgres/bootstrap-roles.sql
        target: /bootstrap/bootstrap-roles.sql
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      postgres:
        condition: service_healthy

  # BACKEND_DIGEST is a content digest, not a tag: sha256:<64 hex chars>.
  # migrate and backend must resolve to the same immutable artifact.
  migrate:
    image: ghcr.io/raphael-antioquia/triageharbor-backend@${BACKEND_DIGEST:?BACKEND_DIGEST is required}
    restart: "no"

    environment:
      TRIAGEHARBOR_MODE: migrate
      SPRING_FLYWAY_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # Migrate mode still builds the full application context,
      # so it carries the runtime identity alongside Flyway's.
      DB_USER: triageharbor_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_MIGRATOR_USER: triageharbor_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}

    depends_on:
      postgres:
        condition: service_healthy

  # Operator-invoked project provisioning. Run after migrate during commissioning.
  # Converges the frontend's configured project as triageharbor_migrator.
  project-provision:
    image: postgres:17.11
    profiles: ["project-provision"]
    restart: "no"
    entrypoint: ["sh", "-ec"]

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
      PGUSER: triageharbor_migrator
      PGPASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      PGAPPNAME: triageharbor-project-provision
      PGCLIENTENCODING: UTF8
      PROJECT_NAME: ${TRIAGEHARBOR_PROJECT_NAME:?TRIAGEHARBOR_PROJECT_NAME is required}

    command:
      - |
        project_id="$$(cat /provision/production-project-id)"
        exec psql \
          -X \
          -qAt \
          -v ON_ERROR_STOP=1 \
          -v project_id="$$project_id" \
          -v project_name="$$PROJECT_NAME" \
          -f /provision/provision-project.sql

    volumes:
      - type: bind
        source: ./prod/postgres/provision-project.sql
        target: /provision/provision-project.sql
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./frontend/production-project-id
        target: /provision/production-project-id
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      postgres:
        condition: service_healthy

  # Explicit operator-only credential lifecycle.
  # Not a dependency of migration or normal services.
  credential-admin:
    image: ghcr.io/raphael-antioquia/triageharbor-backend@${BACKEND_DIGEST:?BACKEND_DIGEST is required}
    profiles: ["credential-admin"]
    restart: "no"

    entrypoint:
      - java
      - -cp
      - application.jar
      - com.triageharbor.CredentialAdmin

    # Never default to issue, list, or revoke.
    command: []

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_MIGRATOR_USER: triageharbor_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}

    logging:
      driver: "none"

    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/raphael-antioquia/triageharbor-backend@${BACKEND_DIGEST:?BACKEND_DIGEST is required}
    restart: unless-stopped

    environment:
      TRIAGEHARBOR_MODE: serve
      SPRING_FLYWAY_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: triageharbor_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      SERVER_FORWARD_HEADERS_STRATEGY: native

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/raphael-antioquia/triageharbor-frontend:${FRONTEND_DEPLOY_SHA:?FRONTEND_DEPLOY_SHA is required}
    restart: unless-stopped

    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      DASHBOARD_USER: ${DASHBOARD_USER:?DASHBOARD_USER is required}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?DASHBOARD_PASSWORD_HASH is required}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddy_data:/data

volumes:
  postgres_data:
  caddy_data:
