name: Publish Backend Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/publish-backend-image.yaml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/triageharbor-backend:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run static analysis
        run: ./gradlew spotbugsMain

      - name: Run tests
        run: ./gradlew test

      - name: Build backend jar
        run: ./gradlew bootJar

      - name: Read backend version
        run: |
          APP_VERSION="$(
            ./gradlew properties -q \
              | sed -n 's/^version: //p'
          )"

          test -n "$APP_VERSION"

          VERSION_LINE_COUNT="$(
            printf '%s\n' "$APP_VERSION" | wc -l
          )"

          test "$VERSION_LINE_COUNT" -eq 1

          printf 'APP_VERSION=%s\n' "$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify backend jar exists
        run: test -f build/libs/app.jar

      - name: Build backend image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          test -n "${APP_VERSION:-}"

          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${APP_VERSION}" \
            --label "org.opencontainers.image.title=TriageHarbor Backend" \
            --label "org.opencontainers.image.description=TriageHarbor backend incident monitoring API" \
            --tag "$IMAGE" \
            .

      - name: Verify backend image invariants
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu

            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"

            test -f /application/application.jar
            test -r /application/application.jar

            test -d /application/lib
            test -r /application/lib
            test -n "$(ls -A /application/lib)"

            # The runtime user may read application code but must not modify it.
            test ! -w /application
          '

          IMAGE_VERSION="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$IMAGE"
          )"

          test -n "$IMAGE_VERSION"
          test "$IMAGE_VERSION" = "$APP_VERSION"
          test "$IMAGE_VERSION" != "24.04"

          IMAGE_SOURCE="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
              "$IMAGE"
          )"

          test "$IMAGE_SOURCE" = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io \
                --username "${GITHUB_ACTOR}" \
                --password-stdin

      - name: Push backend image
        run: docker push "$IMAGE"
