spring.application.name=TriageHarbor

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triageharbor}
spring.datasource.username=${DB_USER:triageharbor_app}
spring.datasource.password=${DB_PASSWORD:triageharbor_app}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATOR_USER:triageharbor_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD:triageharbor_migrator}

triageharbor.ingest.rate-limit.global.capacity=2000
triageharbor.ingest.rate-limit.global.refill-tokens-per-minute=1000

triageharbor.ingest.rate-limit.project.capacity=500
triageharbor.ingest.rate-limit.project.refill-tokens-per-minute=100
