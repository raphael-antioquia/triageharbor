spring.application.name=TriageHarbor

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triageharbor}
spring.datasource.username=${DB_USER:triageharbor}
spring.datasource.password=${DB_PASSWORD:triageharbor}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
